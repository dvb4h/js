<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المنصة الذكية - ASYCUDA والتعرفة الجمركية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap');
        body { font-family: 'Cairo', sans-serif; background-color: #f1f5f9; }
        .glass-panel { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.2); }
        .chart-container { position: relative; width: 100%; max-width: 450px; margin-left: auto; margin-right: auto; height: 260px; max-height: 300px; }
        .input-focus:focus-within { border-color: #2563eb; box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1); }
        .result-card { background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); }
        .hover-float { transition: transform 0.3s ease, box-shadow 0.3s ease; }
        .hover-float:hover { transform: translateY(-6px); box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04); }
        .fab-print { position: fixed; bottom: 2rem; left: 2rem; z-index: 100; }
        .invoice-print-only { display: none; }
        .nav-tab.active { background-color: #2563eb; color: #ffffff; }

        @media print {
            .no-print, #loginScreen, nav, .fab-print, #costChartCard, .whatsapp-section, #tariffSection { display: none !important; }
            .invoice-print-only { display: block !important; }
        }
    </style>
</head>
<body class="text-slate-800">

    <!-- شاشة المصادقة -->
    <div id="loginScreen" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950 px-4">
        <div class="glass-panel w-full max-w-sm p-8 rounded-[2.5rem] shadow-2xl text-center">
            <h1 class="text-2xl font-black text-slate-900 mb-2">الدخول الآمن</h1>
            <input type="password" id="passCode" placeholder="أدخل رمز المرور" class="w-full p-4 mb-4 rounded-2xl border text-center font-bold">
            <button onclick="verifyAccess()" class="w-full bg-blue-600 text-white font-bold py-4 rounded-2xl">تأكيد الهوية</button>
        </div>
    </div>

    <!-- التطبيق الرئيسي -->
    <main id="mainApp" class="hidden min-h-screen relative pb-20">
        <nav class="bg-white/85 backdrop-blur-md border-b border-slate-200 sticky top-0 z-40 px-6 py-4">
            <div class="max-w-6xl mx-auto flex justify-between items-center">
                <h2 class="font-black text-lg">المنصة الذكية</h2>
                <div class="flex bg-slate-100 p-1.5 rounded-2xl">
                    <button onclick="switchTab('calculator')" id="tabBtnCalc" class="nav-tab active px-5 py-2 rounded-xl font-black text-xs">حاسبة ASYCUDA</button>
                    <button onclick="switchTab('tariff')" id="tabBtnTariff" class="nav-tab px-5 py-2 rounded-xl font-black text-xs">قسم التعرفة الجمركية</button>
                </div>
            </div>
        </nav>

        <!-- قسم التعرفة الجمركية (المعدل) -->
        <div id="tariffSection" class="max-w-6xl mx-auto px-4 py-8 hidden">
            <div class="glass-panel p-8 rounded-[2.5rem] shadow-xl">
                <h3 class="text-2xl font-black mb-6">جدول التعرفة الجمركية المعتمدة</h3>
                <div class="overflow-x-auto">
                    <table class="w-full text-right" id="tariffTable">
                        <thead>
                            <tr class="bg-slate-900 text-white text-xs">
                                <th class="p-4">HS CODE</th>
                                <th class="p-4">الوصف</th>
                                <th class="p-4">سنة الصنع</th>
                                <th class="p-4">T.S.C CODE</th>
                                <th class="p-4">المنشأ</th>
                                <th class="p-4">الإجراء</th>
                            </tr>
                        </thead>
                        <tbody id="tariffTableBody" class="divide-y text-sm font-semibold"></tbody>
                    </table>
                </div>
            </div>
        </div>
        
        <!-- (باقي كود الحاسبة يبقى كما هو) -->
    </main>

    <script>
        // ... (التعريفات السابقة) ...
        
        function renderTariffTable() {
            const tbody = document.getElementById('tariffTableBody');
            let rowsHtml = '';
            filteredTariffData.forEach((row) => {
                const hs = getField(row, ['HS CODE', 'H.S CODE', 'hsCode', 'رمز التعرفة']) || '-';
                const desc = getField(row, ['الوصف', 'description', 'المادة', 'اسم المادة']) || '-';
                const year = getField(row, ['سنة الصنع', 'year', 'Year']) || '-';
                const tsc = getField(row, ['T.S.C CODE', 'TSC', 'tscCode']) || '-';
                const origin = getField(row, ['المنشأ', 'origin']) || '-';

                rowsHtml += `
                    <tr class="hover:bg-blue-50">
                        <td class="p-4 font-mono font-black text-blue-600">${escapeHtml(hs)}</td>
                        <td class="p-4">${escapeHtml(desc)}</td>
                        <td class="p-4">${escapeHtml(year)}</td>
                        <td class="p-4 font-mono">${escapeHtml(tsc)}</td>
                        <td class="p-4">${escapeHtml(origin)}</td>
                        <td class="p-4">
                            <button onclick="transferHsAndPriceToCalculator('${escapeHtml(hs)}', '0')" class="bg-blue-600 text-white px-3 py-1 rounded-xl text-xs font-bold">حساب</button>
                        </td>
                    </tr>
                `;
            });
            tbody.innerHTML = rowsHtml;
        }

        // ... (باقي الدوال) ...
        function verifyAccess() {
            if(document.getElementById('passCode').value === '13420') {
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('mainApp').classList.remove('hidden');
            }
        }
        
        function switchTab(tab) {
            document.getElementById('calculatorSection').classList.toggle('hidden', tab !== 'calculator');
            document.getElementById('tariffSection').classList.toggle('hidden', tab !== 'tariff');
            document.getElementById('tabBtnCalc').classList.toggle('active', tab === 'calculator');
            document.getElementById('tabBtnTariff').classList.toggle('active', tab === 'tariff');
        }
    </script>
</body>
</html>

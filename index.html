<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة حسين الحمد - ASYCUDA والتعرفة الجمركية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap');
        body { font-family: 'Cairo', sans-serif; background-color: #f1f5f9; }
        
        .glass-panel { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.2); }
        .chart-container { position: relative; width: 100%; max-width: 450px; margin-left: auto; margin-right: auto; height: 260px; max-height: 300px; }
        .input-focus:focus-within { border-color: #2563eb; box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1); }
        .result-card { background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); }
        
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .animate-up { animation: slideUp 0.6s ease-out forwards; }
        
        .whatsapp-pulse { animation: pulse 2s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.4); } 70% { box-shadow: 0 0 0 15px rgba(34, 197, 94, 0); } 100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); } }

        .hover-float {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .hover-float:hover {
            transform: translateY(-6px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }

        .fab-print {
            position: fixed;
            bottom: 2rem;
            left: 2rem;
            z-index: 100;
            animation: slideUp 0.8s ease-out forwards;
            transition: all 0.3s ease;
        }
        .fab-print:hover {
            transform: scale(1.1) rotate(5deg);
        }

        .invoice-print-only {
            display: none;
        }

        /* تبويب النشاط */
        .nav-tab.active {
            background-color: #2563eb;
            color: #ffffff;
            box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.3);
        }

        @media print {
            @page {
                size: A4 portrait;
                margin: 10mm;
            }
            body { 
                background-color: #ffffff !important; 
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
                color: #000000 !important;
            }
            
            .no-print, #loginScreen, nav, .fab-print, #costChartCard, .whatsapp-section, #tariffSection { 
                display: none !important; 
            }
            
            .invoice-print-only {
                display: block !important;
            }

            #mainApp { display: block !important; }
            #resultsSection { 
                opacity: 1 !important; 
                filter: none !important; 
                pointer-events: auto !important; 
                width: 100% !important;
            }

            .max-w-6xl {
                max-width: 100% !important;
                padding: 0 !important;
                margin: 0 !important;
            }
            
            .grid { 
                display: block !important; 
            }
            
            .lg\:col-span-5, .lg\:col-span-7 { 
                width: 100% !important; 
                margin: 0 !important;
                display: block !important; 
            }

            section.lg\:col-span-5 {
                display: none !important;
            }

            .invoice-box-print {
                border: 2px solid #0f172a !important;
                background: #ffffff !important;
                padding: 24px !important;
                border-radius: 16px !important;
                box-shadow: none !important;
            }

            .result-card { 
                background: #f8fafc !important; 
                color: #0f172a !important; 
                border: 1px solid #cbd5e1 !important;
                box-shadow: none !important;
                margin-bottom: 15px !important;
            }
            .result-card * { 
                color: #0f172a !important; 
            }

            .glass-panel { 
                background: #ffffff !important;
                border: 1px solid #cbd5e1 !important; 
                box-shadow: none !important; 
                padding: 15px !important;
                margin-bottom: 15px !important;
            }
        }
    </style>
</head>
<body class="text-slate-800">

    <div id="loginScreen" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950 px-4">
        <div class="glass-panel w-full max-w-sm p-8 rounded-[2.5rem] shadow-2xl text-center animate-up">
            <div class="w-20 h-20 bg-blue-600 rounded-3xl mx-auto mb-6 flex items-center justify-center text-white text-3xl shadow-xl shadow-blue-500/20">
                <i class="fa-solid fa-lock-keyhole"></i>
            </div>
            <h1 class="text-2xl font-black text-slate-900 mb-2">الدخول الآمن</h1>
            <p class="text-slate-500 text-xs mb-8 font-bold italic">نظام التخليص الجمركي - حسين الحمد</p>
            
            <div class="relative mb-6">
                <input type="password" id="passCode" placeholder="أدخل رمز المرور" 
                    class="w-full p-4 pr-12 rounded-2xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500 text-center tracking-[0.5em] font-bold text-lg"
                    onkeypress="if(event.key==='Enter') verifyAccess()">
                <i class="fa-solid fa-key-skeleton absolute right-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
            </div>
            
            <button onclick="verifyAccess()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-2xl transition-all shadow-lg active:scale-95">
                تأكيد الهوية
            </button>
            <p id="loginError" class="text-red-500 text-xs mt-4 font-bold hidden">عذراً، الرمز غير صحيح</p>
        </div>
    </div>

    <main id="mainApp" class="hidden min-h-screen relative pb-20">
        
        <nav class="bg-white/85 backdrop-blur-md border-b border-slate-200 sticky top-0 z-40 px-6 py-4 no-print">
            <div class="max-w-6xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-slate-900 rounded-xl flex items-center justify-center text-white text-xl">
                        <i class="fa-solid fa-ship"></i>
                    </div>
                    <div>
                        <h2 class="font-black text-slate-900 text-lg leading-none">منصة حسين الحمد</h2>
                        <span class="text-[10px] text-blue-600 font-bold uppercase tracking-widest">للتخليص الجمركي والتعرفة</span>
                    </div>
                </div>

                <div class="flex items-center bg-slate-100 p-1.5 rounded-2xl border border-slate-200">
                    <button onclick="switchTab('calculator')" id="tabBtnCalc" class="nav-tab active px-5 py-2.5 rounded-xl font-black text-xs transition-all flex items-center gap-2">
                        <i class="fa-solid fa-calculator"></i>
                        <span>حاسبة ASYCUDA</span>
                    </button>
                    <button onclick="switchTab('tariff')" id="tabBtnTariff" class="nav-tab text-slate-600 hover:text-slate-900 px-5 py-2.5 rounded-xl font-black text-xs transition-all flex items-center gap-2">
                        <i class="fa-solid fa-table-list"></i>
                        <span>قسم التعرفة الجمركية</span>
                    </button>
                </div>

                <div class="flex items-center gap-3">
                    <button onclick="location.reload()" class="bg-slate-50 hover:bg-red-50 text-slate-400 hover:text-red-600 p-2.5 rounded-xl transition-all border border-slate-100" title="خروج">
                        <i class="fa-solid fa-power-off"></i>
                    </button>
                </div>
            </div>
        </nav>

        <div id="calculatorSection" class="max-w-6xl mx-auto px-4 py-8 grid grid-cols-1 lg:grid-cols-12 gap-8">
            
            <section class="lg:col-span-5 space-y-6 no-print">
                <div class="glass-panel p-8 rounded-[2.5rem] shadow-xl border-white relative overflow-hidden hover-float">
                    <div class="mb-8">
                        <h3 class="text-xl font-black text-slate-900">حاسبة ASYCUDA الذكية</h3>
                        <p class="text-sm text-slate-500 mt-1">تحديث المسميات الجمركية لعام 2025-2026</p>
                    </div>

                    <div class="space-y-5">
                        <div class="input-focus border border-slate-200 rounded-2xl p-4 transition-all bg-white">
                            <label class="block text-[10px] font-black text-blue-600 mb-1">المبلغ الإجمالي بالدولار ($)</label>
                            <div class="flex items-center">
                                <span class="font-black text-slate-400 ml-2">$</span>
                                <input type="text" id="mainAmount" oninput="formatCurrency(this)" 
                                    class="w-full bg-transparent border-none focus:outline
